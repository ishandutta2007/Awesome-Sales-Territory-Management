<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic / Animated Hexagon and Radar Pulse Effects */
    @keyframes pulse {
      0% { r: 20px; opacity: 0.8; }
      50% { r: 60px; opacity: 0.2; }
      100% { r: 100px; opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-ring {
      animation: pulse 4s infinite ease-out;
      transform-origin: 980px 160px;
    }
    .floating-card {
      animation: float 5s infinite ease-in-out;
    }
    .animated-route {
      stroke-dasharray: 8 6;
      animation: dash 2s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / BACKGROUND ANIMATED GRAPHICAL ELEMENTS (Kept in Background / Right Side) -->
  <g opacity="0.35">
    <!-- Hexagonal Territory Map Grid (Right Side) -->
    <polygon points="980,60 1030,90 1030,150 980,180 930,150 930,90" fill="none" stroke="#818cf8" stroke-width="2" />
    <polygon points="1035,155 1085,185 1085,245 1035,275 985,245 985,185" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="925,155 975,185 975,245 925,275 875,245 875,185" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="870,60 920,90 920,150 870,180 820,150 820,90" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Animated Pulsing Radar Pin -->
    <circle cx="980" cy="160" r="40" fill="none" stroke="#38bdf8" stroke-width="2" class="pulsing-ring" />
    <circle cx="980" cy="160" r="6" fill="#38bdf8" filter="url(#glow)" />
    
    <!-- Dynamic Connecting Route Lines -->
    <path d="M 780 220 Q 880 120 980 160 T 1085 215" fill="none" stroke="#c084fc" stroke-width="2" class="animated-route" />
  </g>

  <!-- Floating Graphical Node (Background Right) -->
  <g class="floating-card" opacity="0.25">
    <rect x="850" y="40" width="140" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="875" cy="64" r="10" fill="#22c55e" />
    <rect x="895" y="56" width="70" height="8" rx="4" fill="#64748b" />
  </g>

  <!-- FOREGROUND TEXT & CONTENT (Guaranteed Unhidden & Clear) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="21" text-anchor="middle" class="badge-text">🗺️ REVOPS &amp; SALES PLANNING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#shadow)">
      Awesome Sales Territory Management
    </text>

    <!-- Vibrant Gradient Accent Line -->
    <rect x="0" y="162" width="620" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">
      Curated SaaS Platforms, Geo-Mapping Tools &amp; Open-Source Optimization Engines
    </text>

    <!-- Bottom Metrics / Tech Tags -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" />
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📊 SaaS Pricing &amp; Scale</text>

      <!-- Tag 2 -->
      <rect x="160" y="0" width="165" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" />
      <text x="242" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Open-Source ⭐ Stars</text>

      <!-- Tag 3 -->
      <rect x="335" y="0" width="160" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" />
      <text x="415" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🗺️ GIS &amp; Territory H3</text>
    </g>
  </g>
</svg>
